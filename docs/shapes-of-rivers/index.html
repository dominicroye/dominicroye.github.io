<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shapes of Rivers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* A dark navy canvas with a slim, borderless control column: segmented choices on top, quiet filters below. */
:root { --bg:#0A1B33; --line:rgba(143,176,214,.22); --ink:#EAF4FF; --muted:#8FB0D6; --accent:#5FB0FF; --font:Lato,"Helvetica Neue",Arial,sans-serif; color-scheme:dark; }
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 var(--font); }
.app { display:grid; grid-template-columns:minmax(0,1fr) 288px; gap:8px 36px; padding:20px 24px 16px; max-width:1560px; margin:0 auto; }
header { grid-column:1/-1; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
h1 { margin:0; font-weight:900; text-transform:uppercase; letter-spacing:.01em; font-size:clamp(26px,4.4vw,46px); line-height:1; text-wrap:balance; }
.sub { color:var(--muted); margin:6px 0 0; font-size:13.5px; }
.lang { display:flex; gap:2px; font-size:12px; align-items:center; }
.tools { display:flex; align-items:center; gap:6px; position:relative; }
.info { width:26px; height:26px; border-radius:50%; border:1px solid var(--line); background:none; color:var(--muted); font:700 14px/1 Georgia,serif; font-style:italic; cursor:pointer; padding:0; }
.info:hover,.info[aria-expanded="true"] { color:var(--ink); border-color:var(--accent); }
.pop { position:absolute; right:0; top:34px; width:min(360px,86vw); background:#0F2544; border:1px solid var(--line); border-radius:12px; padding:16px 18px; z-index:5; box-shadow:0 12px 40px rgba(0,0,0,.45); font-size:13px; line-height:1.55; }
.pop[hidden] { display:none; }
.pop h3 { margin:0 0 6px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:700; }
.pop p { margin:0 0 12px; }
.pop p:last-child { margin:0; }
.pop a { color:var(--accent); text-underline-offset:3px; }
.lang button { border:0; background:none; color:var(--muted); padding:4px 7px; border-radius:6px; font-weight:700; letter-spacing:.06em; }
.lang button[aria-pressed="true"] { color:var(--ink); background:rgba(143,176,214,.16); }
.stage { position:relative; height:min(82vh,880px); min-height:480px; overflow:hidden; }
canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:pan-y; }
.tip { position:absolute; pointer-events:none; background:#0F2544; border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:13px; white-space:nowrap; display:none; z-index:3; }
.tip strong { display:block; font-size:14px; }
.tip span { color:var(--muted); }
aside { display:flex; flex-direction:column; gap:22px; padding-top:6px; }
section { display:flex; flex-direction:column; gap:10px; }
h2 { margin:0; font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.seg { display:flex; border:1px solid var(--line); border-radius:9px; padding:2px; gap:2px; }
.seg button { flex:1; border:0; background:none; color:var(--muted); font:inherit; font-weight:700; padding:7px 6px; border-radius:7px; cursor:pointer; white-space:nowrap; }
.seg button:hover { color:var(--ink); }
.seg button[aria-pressed="true"] { background:rgba(95,176,255,.18); color:var(--ink); box-shadow:inset 0 0 0 1px rgba(95,176,255,.55); }
.seg button:disabled { opacity:.35; cursor:default; }
.seg.small button { font-weight:400; padding:6px 4px; }
.seg.small button[aria-pressed="true"] { font-weight:700; }
.field { display:flex; flex-direction:column; gap:6px; }
.field > .lbl { display:flex; justify-content:space-between; color:var(--muted); font-size:12.5px; }
.val { color:var(--ink); font-variant-numeric:tabular-nums; font-weight:700; }
button:focus-visible,input:focus-visible,summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
input[type=range] { width:100%; accent-color:var(--accent); margin:0; }
input[type=text] { width:100%; font:inherit; color:var(--ink); background:none; border:0; border-bottom:1px solid var(--line); padding:6px 0; border-radius:0; }
input[type=text]::placeholder { color:rgba(143,176,214,.6); }
input[type=text]:focus { border-bottom-color:var(--accent); outline:0; }
.chips { display:flex; flex-wrap:wrap; gap:4px 6px; }
.chip { border:0; background:none; color:var(--muted); font:inherit; padding:3px 8px; border-radius:99px; cursor:pointer; text-decoration:line-through; text-decoration-color:transparent; }
.chip[aria-pressed="true"] { color:var(--ink); background:rgba(143,176,214,.16); }
.chip[aria-pressed="false"] { opacity:.55; }
.pins { display:flex; flex-wrap:wrap; gap:6px; }
.pin { display:inline-flex; align-items:center; gap:2px; padding:2px 2px 2px 10px; border:1px solid var(--ink); border-radius:99px; font-size:12.5px; }
.pin button { border:0; background:none; color:var(--ink); padding:0 6px; font-size:15px; cursor:pointer; }
.hint { margin:0; color:var(--muted); font-size:12.5px; }
.sw { display:flex; align-items:center; justify-content:space-between; color:var(--ink); cursor:pointer; }
.sw input { appearance:none; width:32px; height:18px; border-radius:99px; background:rgba(143,176,214,.28); position:relative; margin:0; cursor:pointer; transition:background .2s; }
.sw input::after { content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--ink); transition:transform .2s; }
.sw input:checked { background:var(--accent); }
.sw input:checked::after { transform:translateX(14px); background:#06162B; }
details summary { list-style:none; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
details summary::-webkit-details-marker { display:none; }
details summary::after { content:"+"; color:var(--muted); font-size:16px; line-height:1; }
details[open] summary::after { content:"–"; }
details > .body, .body { display:flex; flex-direction:column; gap:12px; }
details > .body { margin-top:12px; }
summary h2 { cursor:pointer; }
summary:hover h2 { color:var(--ink); }
footer { grid-column:1/-1; color:var(--muted); font-size:12px; display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 24px; }
@media (max-width:900px){ .app{grid-template-columns:1fr; padding:14px;} .stage{height:68vh;} aside{gap:18px;} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;} }
</style>
</head>

<div class="app">
  <header>
    <div>
      <h1 data-i="title">The shapes of rivers</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="tools">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="l-en" aria-pressed="true">EN</button><button type="button" id="l-es" aria-pressed="false">ES</button>
      </div>
      <button type="button" class="info" id="info" aria-expanded="false" aria-controls="pop" aria-label="About">i</button>
      <div class="pop" id="pop" role="dialog" aria-label="About" hidden>
        <h3 data-i="h_data">Data</h3><p data-i="i_data"></p>
        <h3 data-i="h_how">How it is built</h3><p data-i="i_how"></p>
        <h3 data-i="h_author">Author</h3><p><a href="https://dominicroye.github.io" target="_blank" rel="noopener noreferrer">Dominic Royé</a> · <a href="https://dominicroye.github.io" target="_blank" rel="noopener noreferrer">dominicroye.github.io</a></p>
      </div>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" role="img" aria-label="Rivers of the world drawn on a canvas"></canvas>
    <div class="tip" id="tip"></div>
  </div>

  <aside>
    <section>
      <details>
        <summary><h2 data-i="g_shape">Shape</h2></summary>
        <div class="body">
<div class="seg" id="shape">
  <button type="button" data-v="map" data-i="s_map">Map</button>
  <button type="button" data-v="radial" data-i="s_radial">Radial</button>
  <button type="button" data-v="drop" data-i="s_drop">Drop</button>
</div>
<div class="seg small" id="length">
  <button type="button" data-v="real" data-i="l_real">Real length</button>
  <button type="button" data-v="equal" data-i="l_equal">Equal length</button>
</div>
<div class="seg small" id="anchor">
  <button type="button" data-v="source" data-i="a_src">From source</button>
  <button type="button" data-v="mouth" data-i="a_mouth">From mouth</button>
</div>
    </div>
      </details>
    </section>

    <section>
      <details>
        <summary><h2 data-i="g_view">View</h2></summary>
        <div class="body">
<div class="seg" id="view">
  <button type="button" data-v="all" data-i="v_all">Together</button>
  <button type="button" data-v="cont" data-i="v_cont">By continent</button>
</div>
    </div>
      </details>
    </section>

    <section>
      <details>
        <summary><h2 data-i="g_filter">Filter</h2></summary>
        <div class="body">
<div class="field">
  <div class="lbl"><span data-i="minlen">Minimum length</span><span class="val" id="minkm-val"></span></div>
  <input type="range" id="minkm" min="200" max="3000" step="50" value="200" aria-label="Minimum length in kilometres">
</div>
<div class="chips" id="contchips"></div>
<p class="hint" id="count"></p>
<input type="text" id="find" list="names" placeholder="Find a river…" autocomplete="off" aria-label="Find a river by name">
<datalist id="names"></datalist>
<div class="pins" id="pins"></div>
    </div>
      </details>
    </section>

    <section>
      <details>
        <summary><h2 data-i="g_style">Display</h2></summary>
        <div class="body">
<div class="body">
    <label class="sw"><span data-i="outlines">Continent outlines</span><input type="checkbox" id="o-out" checked></label>
    <label class="sw"><span data-i="famous">Highlight rivers</span><input type="checkbox" id="o-famous" checked></label>
    <div class="field"><div class="lbl"><span id="nhi-lbl" data-i="nhi">Highlighted rivers</span><span class="val" id="nhi-val">4</span></div><input type="range" id="o-n" min="1" max="20" step="1" value="4" aria-label="Number of highlighted rivers"></div>
    <div class="field"><div class="lbl"><span data-i="opacity">Opacity</span></div><input type="range" id="o-op" min="0.3" max="2.2" step="0.05" value="1" aria-label="Opacity"></div>
    <div class="field"><div class="lbl"><span data-i="width">Line width</span></div><input type="range" id="o-lw" min="0.4" max="2.5" step="0.05" value="1" aria-label="Line width"></div>
  </div>
    </div>
      </details>
    </section>
  </aside>
</div>
